<!DOCTYPE html>
<!-- [tests/index.html] Phase 1 · Phase 2 테스트 실행 페이지 — 브라우저에서 열면 모든 테스트가 자동 실행된다 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>미니 React 테스트</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --text: #1c2330; --pass: #15803d; --fail: #b91c1c; --muted: #5d6778; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151b; --text: #e4e8ef; --pass: #4ade80; --fail: #f87171; --muted: #9aa3b2; }
    }
    body { margin: 0 auto; max-width: 960px; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    h2 { font-size: 1rem; margin: 20px 0 4px; }
    ul { margin: 0; padding-left: 20px; }
    .pass { color: var(--pass); }
    .fail { color: var(--fail); }
    pre { white-space: pre-wrap; font-size: 0.8rem; color: var(--muted); }
    #summary { font-weight: 600; font-size: 1.05rem; }
  </style>
</head>
<body>
  <h1>미니 React 테스트 (Phase 1 · Phase 2)</h1>
  <p id="summary">실행 중…</p>
  <div id="output"></div>

  <script type="module">
    // 테스트 파일을 불러오면 describe/test 가 등록되고, run() 이 차례로 실행한다.
    import { run } from "./runner.js";
    // 테스트 항목 #001 ~ #357 (번호 순서)
    import "./cases-vdom.test.js"; //          #001~#080 h · DOM→VDOM · VDOM→DOM
    import "./cases-diff-patch.test.js"; //    #081~#170 Diff · Patch · Props
    import "./cases-history-html.test.js"; //  #171~#230 History · Serialize
    import "./cases-random.test.js"; //        #256~#290 랜덤 · 대량
    import "./cases-security.test.js"; //      #291~#315 안정성 · 보안
    import "./cases-invalid.test.js"; //       잘못된 VNode · Patch 입력
    import "./cases-all-tags.test.js"; //      모든 HTML 태그 112개 (Phase 1 · Phase 2)
    // Phase 2: Component · State · Hooks
    import "./component.test.js";
    import "./hooks.test.js";
    // iframe 으로 실제 페이지를 여는 테스트는 시간이 걸려 맨 마지막
    import "./cases-page.test.js"; //          #231~#255 페이지 초기화 · 이벤트
    import "./cases-examples.test.js"; //      #316~#357 Phase 1 예시 변경 버튼 · 테스트 카드
    import "./app.test.js"; //                 Phase 2 페이지 (app.html)

    const summary = document.getElementById("summary");
    const result = await run(document.getElementById("output"));
    summary.textContent = `전체 ${result.total}개 · 통과 ${result.passed}개 · 실패 ${result.failed}개 (${result.ms}ms)`;
    summary.className = result.failed ? "fail" : "pass";
    document.title = `${result.failed ? "✘" : "✔"} 미니 React 테스트`;
  </script>
</body>
</html>
