<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#191f28" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="980" height="470" rx="24" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="979" height="469" rx="24" fill="none" stroke="#f2f4f6"/>

  <text x="40" y="58" font-size="24" font-weight="800" fill="#191f28">이렇게 협업했어요</text>
  <text x="40" y="86" font-size="15" fill="#8b95a1">겉모양만 맞추고, 속은 각자 자유롭게</text>

  <!-- 4단계 카드 -->
  <g font-size="13.5" fill="#4e5968">
    <!-- 1 -->
    <rect x="40" y="114" width="208" height="236" rx="20" fill="#f9fafb"/>
    <circle cx="76" cy="146" r="14" fill="#e8f3ff"/>
    <text x="76" y="151" font-size="14" font-weight="800" fill="#3182f6" text-anchor="middle">1</text>
    <text x="62" y="194" font-size="18" font-weight="800" fill="#191f28">인터페이스 합의</text>
    <text x="62" y="222">VDOM 모양과</text>
    <text x="62" y="242">파일 · 함수 이름만 고정</text>
    <rect x="58" y="296" width="172" height="34" rx="10" fill="#ffffff"/>
    <text x="144" y="318" font-size="12" fill="#1b64da" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">{ type, props, children }</text>

    <!-- 2 -->
    <rect x="272" y="114" width="208" height="236" rx="20" fill="#f9fafb"/>
    <circle cx="308" cy="146" r="14" fill="#e8f3ff"/>
    <text x="308" y="151" font-size="14" font-weight="800" fill="#3182f6" text-anchor="middle">2</text>
    <text x="294" y="194" font-size="18" font-weight="800" fill="#191f28">dev에 뼈대</text>
    <text x="294" y="222">함수 껍데기와 규칙만</text>
    <text x="294" y="242">먼저 올려 두기</text>
    <rect x="290" y="296" width="172" height="34" rx="10" fill="#ffffff"/>
    <text x="376" y="318" font-size="12.5" fill="#1b64da" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">dev</text>

    <!-- 3 -->
    <rect x="504" y="114" width="208" height="236" rx="20" fill="#f9fafb"/>
    <circle cx="540" cy="146" r="14" fill="#e8f3ff"/>
    <text x="540" y="151" font-size="14" font-weight="800" fill="#3182f6" text-anchor="middle">3</text>
    <text x="526" y="194" font-size="18" font-weight="800" fill="#191f28">각자 구현</text>
    <text x="526" y="222">같은 과제를</text>
    <text x="526" y="242">세 명이 처음부터</text>
    <g font-size="11.5" font-family="'JetBrains Mono', Consolas, monospace" text-anchor="middle">
      <rect x="522" y="256" width="172" height="26" rx="8" fill="#3182f6"/>
      <text x="608" y="273" fill="#ffffff" font-weight="700">feat/Kimgeonhui-React</text>
      <rect x="522" y="286" width="172" height="26" rx="8" fill="#ffffff"/>
      <text x="608" y="303" fill="#4e5968">feat/Kimjeonghee-React</text>
      <rect x="522" y="316" width="172" height="26" rx="8" fill="#ffffff"/>
      <text x="608" y="333" fill="#4e5968">feat/Kimjunwoo-React</text>
    </g>

    <!-- 4 -->
    <rect x="736" y="114" width="204" height="236" rx="20" fill="#e8f3ff"/>
    <circle cx="772" cy="146" r="14" fill="#3182f6"/>
    <text x="772" y="151" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="758" y="194" font-size="18" font-weight="800" fill="#191f28">서로 비교</text>
    <text x="758" y="222" fill="#333d4b">서로의 코드를 바꿔 끼워</text>
    <text x="758" y="242" fill="#333d4b">같은 테스트로 비교</text>
    <text x="758" y="300" font-weight="700" fill="#1b64da">좋은 점은 서로 가져와</text>
    <text x="758" y="320" font-weight="700" fill="#1b64da">dev에 합치기</text>
  </g>

  <!-- 단계 사이 화살표 -->
  <g fill="none" stroke="#c4cad2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 226 l6 6 l-6 6"/>
    <path d="M488 226 l6 6 l-6 6"/>
    <path d="M720 226 l6 6 l-6 6"/>
  </g>

  <!-- 도구 -->
  <g>
    <rect x="40" y="374" width="438" height="64" rx="18" fill="#f9fafb"/>
    <circle cx="74" cy="406" r="16" fill="#ffffff"/>
    <rect x="66" y="399" width="16" height="3" rx="1.5" fill="#3182f6"/>
    <rect x="66" y="405" width="12" height="3" rx="1.5" fill="#3182f6"/>
    <rect x="66" y="411" width="9" height="3" rx="1.5" fill="#3182f6"/>
    <text x="102" y="401" font-size="15" font-weight="800" fill="#191f28">GitHub Project</text>
    <text x="102" y="422" font-size="13" fill="#6b7684">Phase별 이슈와 체크리스트로 진행 상황 공유</text>

    <rect x="502" y="374" width="438" height="64" rx="18" fill="#f9fafb"/>
    <circle cx="536" cy="406" r="16" fill="#ffffff"/>
    <path d="M528 406 l5 5 l10 -10" fill="none" stroke="#3182f6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="564" y="401" font-size="15" font-weight="800" fill="#191f28">AI 교차 검증</text>
    <text x="564" y="422" font-size="13" fill="#6b7684">Claude로 구현 → Gemini로 리뷰 → 재현된 것만 수정</text>
  </g>
</svg>
