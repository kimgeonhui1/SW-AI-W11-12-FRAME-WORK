<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" width="980" height="900" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect width="980" height="900" rx="24" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="979" height="899" rx="24" fill="none" stroke="#f2f4f6"/>

  <text x="40" y="58" font-size="24" font-weight="800" fill="#191f28">화면이 그려지는 과정</text>
  <text x="40" y="86" font-size="15" fill="#8b95a1">처음 한 번은 통째로 만들고, 그다음부터는 바뀐 곳만 고쳐요</text>

  <!-- ── A. 처음 한 번 ── -->
  <rect x="40" y="112" width="72" height="26" rx="13" fill="#f2f4f6"/>
  <text x="76" y="130" font-size="12.5" font-weight="700" fill="#4e5968" text-anchor="middle">처음 한 번</text>
  <g font-size="13" fill="#6b7684">
    <rect x="40" y="150" width="202" height="76" rx="18" fill="#f9fafb"/>
    <text x="60" y="182" font-size="15" font-weight="800" fill="#191f28" font-family="'JetBrains Mono', Consolas, monospace">App()</text>
    <text x="60" y="206">VDOM을 돌려주는 함수</text>

    <rect x="266" y="150" width="202" height="76" rx="18" fill="#f9fafb"/>
    <text x="286" y="182" font-size="15" font-weight="800" fill="#191f28">VDOM</text>
    <text x="286" y="206">화면을 적은 JS 객체</text>

    <rect x="492" y="150" width="202" height="76" rx="18" fill="#f9fafb"/>
    <text x="512" y="182" font-size="15" font-weight="800" fill="#191f28" font-family="'JetBrains Mono', Consolas, monospace">createElement</text>
    <text x="512" y="206">VDOM 전체를 실제 DOM으로</text>

    <rect x="718" y="150" width="222" height="76" rx="18" fill="#f9fafb"/>
    <text x="738" y="182" font-size="15" font-weight="800" fill="#191f28">화면 표시</text>
    <text x="738" y="206">이 VDOM은 기억해 둬요</text>
  </g>
  <g fill="none" stroke="#c4cad2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 182 l6 6 l-6 6"/>
    <path d="M476 182 l6 6 l-6 6"/>
    <path d="M702 182 l6 6 l-6 6"/>
  </g>

  <!-- ── B. 클릭할 때마다 ── -->
  <rect x="40" y="262" width="104" height="26" rx="13" fill="#e8f3ff"/>
  <text x="92" y="280" font-size="12.5" font-weight="700" fill="#1b64da" text-anchor="middle">클릭할 때마다</text>

  <g font-size="13.5" fill="#4e5968">
    <!-- ① -->
    <rect x="40" y="300" width="284" height="132" rx="20" fill="#f9fafb"/>
    <circle cx="68" cy="330" r="13" fill="#3182f6"/>
    <text x="68" y="335" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="92" y="336" font-size="16" font-weight="800" fill="#191f28">클릭 → <tspan font-family="'JetBrains Mono', Consolas, monospace" font-size="15">setState</tspan></text>
    <text x="60" y="378">새 값을 hooks 배열에 저장하고</text>
    <text x="60" y="400">바로 그리지는 않아요</text>

    <!-- ② -->
    <rect x="348" y="300" width="284" height="132" rx="20" fill="#f9fafb"/>
    <circle cx="376" cy="330" r="13" fill="#3182f6"/>
    <text x="376" y="335" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="400" y="336" font-size="16" font-weight="800" fill="#191f28">다시 그리기 예약</text>
    <rect x="534" y="321" width="78" height="22" rx="11" fill="#e8f3ff"/>
    <text x="573" y="336" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">Batching</text>
    <text x="368" y="378">setState를 여러 번 불러도 모아서</text>
    <text x="368" y="400">하던 일이 끝나면 <tspan font-weight="800" fill="#191f28">딱 한 번</tspan> 그려요</text>

    <!-- ③ -->
    <rect x="656" y="300" width="284" height="132" rx="20" fill="#f9fafb"/>
    <circle cx="684" cy="330" r="13" fill="#3182f6"/>
    <text x="684" y="335" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="708" y="336" font-size="16" font-weight="800" fill="#191f28"><tspan font-family="'JetBrains Mono', Consolas, monospace" font-size="15">App()</tspan> 다시 호출</text>
    <rect x="850" y="321" width="70" height="22" rx="11" fill="#e8f3ff"/>
    <text x="885" y="336" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">렌더링</text>
    <text x="676" y="378">처음과 같은 함수를 한 번 더 부르면</text>
    <text x="676" y="400">useState가 새 값을 줘서 → 새 VDOM</text>

    <!-- ④ -->
    <rect x="40" y="468" width="284" height="132" rx="20" fill="#f9fafb"/>
    <circle cx="68" cy="498" r="13" fill="#3182f6"/>
    <text x="68" y="503" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="92" y="504" font-size="16" font-weight="800" fill="#191f28">바뀐 곳 찾기</text>
    <rect x="60" y="522" width="244" height="30" rx="10" fill="#ffffff"/>
    <text x="182" y="542" font-size="14" font-weight="700" fill="#1b64da" text-anchor="middle">diff(이전 VDOM, 새 VDOM)</text>
    <text x="60" y="580">→ 바뀐 곳만 담은 <tspan font-weight="800" fill="#191f28">패치 트리</tspan></text>

    <!-- ⑤ -->
    <rect x="348" y="468" width="284" height="132" rx="20" fill="#f9fafb"/>
    <circle cx="376" cy="498" r="13" fill="#3182f6"/>
    <text x="376" y="503" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
    <text x="400" y="504" font-size="16" font-weight="800" fill="#191f28">바뀐 곳만 고치기</text>
    <rect x="368" y="522" width="244" height="30" rx="10" fill="#ffffff"/>
    <text x="490" y="542" font-size="14" font-weight="700" fill="#1b64da" text-anchor="middle">patch(실제 DOM, 패치 트리)</text>
    <text x="368" y="580">입력 중인 값 · 포커스는 그대로</text>

    <!-- ⑥ -->
    <rect x="656" y="468" width="284" height="132" rx="20" fill="#f9fafb"/>
    <circle cx="684" cy="498" r="13" fill="#3182f6"/>
    <text x="684" y="503" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
    <text x="708" y="504" font-size="16" font-weight="800" fill="#191f28"><tspan font-family="'JetBrains Mono', Consolas, monospace" font-size="15">useEffect</tspan> 실행</text>
    <text x="676" y="546">화면이 바뀐 <tspan font-weight="800" fill="#191f28">뒤</tspan>에 할 일</text>
    <text x="676" y="568">탭 제목 바꾸기, 기보 스크롤 등</text>
  </g>
  <g fill="none" stroke="#c4cad2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 360 l6 6 l-6 6"/>
    <path d="M640 360 l6 6 l-6 6"/>
    <path d="M332 528 l6 6 l-6 6"/>
    <path d="M640 528 l6 6 l-6 6"/>
    <!-- ③ → ④ -->
    <path d="M798 432 L798 450 L182 450 L182 462" stroke-dasharray="0"/>
    <path d="M176 456 l6 6 l6 -6"/>
  </g>

  <!-- 알아 둘 점 -->
  <rect x="40" y="624" width="900" height="104" rx="18" fill="#f9fafb"/>
  <g font-size="13.5" fill="#4e5968">
    <circle cx="62" cy="652" r="3" fill="#3182f6"/>
    <text x="74" y="657">③의 새 VDOM은 다음 클릭 때 ④의 <tspan font-weight="800" fill="#191f28">"이전 VDOM"</tspan>이 돼요 — 화면의 DOM을 다시 읽지 않아요</text>
    <circle cx="62" cy="678" r="3" fill="#3182f6"/>
    <text x="74" y="683">⑥에서 또 setState를 부르면 다시 ①부터 — 사용자 입력 없이 <tspan font-weight="800" fill="#191f28">50번 연속</tspan>이면 무한 반복으로 보고 멈춰요</text>
    <circle cx="62" cy="704" r="3" fill="#3182f6"/>
    <text x="74" y="709">③에서 VDOM이 잘못 만들어지면 ④ · ⑤를 하지 않아서, 화면이 반쯤만 바뀌는 일이 없어요</text>
  </g>

  <!-- ── 파일 구성 ── -->
  <text x="40" y="776" font-size="17" font-weight="800" fill="#191f28">파일 구성</text>
  <text x="128" y="776" font-size="13" fill="#8b95a1">src/core/ · 팀 공통 인터페이스</text>
  <g font-size="12.5" fill="#6b7684">
    <rect x="40" y="792" width="168" height="72" rx="16" fill="#f9fafb"/>
    <text x="58" y="822" font-size="14" font-weight="800" fill="#191f28" font-family="'JetBrains Mono', Consolas, monospace">vdom.js</text>
    <text x="58" y="846">h · createElement · 검사</text>

    <rect x="223" y="792" width="168" height="72" rx="16" fill="#f9fafb"/>
    <text x="241" y="822" font-size="14" font-weight="800" fill="#191f28" font-family="'JetBrains Mono', Consolas, monospace">diff.js</text>
    <text x="241" y="846">④ 두 VDOM 비교</text>

    <rect x="406" y="792" width="168" height="72" rx="16" fill="#f9fafb"/>
    <text x="424" y="822" font-size="14" font-weight="800" fill="#191f28" font-family="'JetBrains Mono', Consolas, monospace">patch.js</text>
    <text x="424" y="846">⑤ 실제 DOM 고치기</text>

    <rect x="589" y="792" width="168" height="72" rx="16" fill="#f9fafb"/>
    <text x="607" y="822" font-size="14" font-weight="800" fill="#191f28" font-family="'JetBrains Mono', Consolas, monospace">component.js</text>
    <text x="607" y="846">처음 · ②③ 렌더링</text>

    <rect x="772" y="792" width="168" height="72" rx="16" fill="#f9fafb"/>
    <text x="790" y="822" font-size="14" font-weight="800" fill="#191f28" font-family="'JetBrains Mono', Consolas, monospace">hooks.js</text>
    <text x="790" y="846">①⑥ useState · useEffect</text>
  </g>
</svg>
