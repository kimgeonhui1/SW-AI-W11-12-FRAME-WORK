<!DOCTYPE html>
<!-- [index.html] Phase 1 페이지 — Virtual DOM / Diff / Patch 검증 (실제 영역, 테스트 영역) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Phase 1 - Virtual DOM / Diff / Patch</title>
  <link rel="stylesheet" href="./src/styles/style.css" />
</head>
<body>
  <h1>Phase 1 · Virtual DOM / Diff / Patch</h1>
  <div class="toolbar">
    <button id="patch-btn">Patch</button>
    <button id="undo-btn">뒤로가기</button>
    <button id="redo-btn">앞으로가기</button>
  </div>
  <div class="areas">
    <section>
      <h2>실제 영역</h2>
      <!-- 샘플 HTML. 페이지가 로드되면 main.js가 이 DOM을 domToVdom으로 읽어 Virtual DOM으로 만든다 -->
      <div id="real-area">
        <h3 class="title">할 일 목록</h3>
        <ul id="todo">
          <li>Virtual DOM 만들기</li>
          <li>Diff 구현</li>
        </ul>
        <p style="color: gray;">총 <b>2</b>개</p>
        <input value="입력값" />
        <label><input type="checkbox" checked /> 완료</label>
      </div>
    </section>
    <section>
      <h2>테스트 영역 (HTML을 고친 뒤 Patch)</h2>
      <div id="test-area"><textarea id="test-input" spellcheck="false"></textarea></div>
    </section>
  </div>
  <h2>마지막 diff 결과</h2>
  <pre id="patch-log"></pre>
  <script type="module" src="./src/phase1/main.js"></script>
</body>
</html>
