<!DOCTYPE html>
<!-- [index.html] Phase 1 페이지 — Virtual DOM / Diff / Patch 검증 (실제 영역, 테스트 영역) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 1 - Virtual DOM / Diff / Patch</title>
  <link rel="stylesheet" href="./src/styles/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">Mini <span>React</span></div>
    <nav class="site-nav">
      <a href="./index.html" aria-current="page">Phase 1 · VDOM</a>
      <a href="./app.html">Phase 2 · Hooks</a>
    </nav>
  </header>

  <main class="page">
    <h1 class="page-title">Virtual DOM / Diff / Patch</h1>
    <p class="page-desc">테스트 영역의 HTML을 고치고 Patch를 누르면, 바뀐 부분만 실제 영역에 반영됩니다.</p>

    <div class="toolbar">
      <button id="patch-btn" class="primary">Patch</button>
      <button id="undo-btn">← 뒤로가기</button>
      <button id="redo-btn">앞으로가기 →</button>
    </div>

    <div class="areas">
      <section class="card">
        <div class="card-header"><h2>실제 영역</h2><small>실제 DOM</small></div>
        <!-- 샘플 HTML. 페이지가 로드되면 main.js가 이 DOM을 domToVdom으로 읽어 Virtual DOM으로 만든다 -->
        <div id="real-area" class="card-body">
          <h3 class="title">할 일 목록</h3>
          <ul id="todo">
            <li>Virtual DOM 만들기</li>
            <li>Diff 구현</li>
          </ul>
          <p style="color: gray;">총 <b>2</b>개</p>
          <input value="입력값" />
          <label><input type="checkbox" checked /> 완료</label>
        </div>
      </section>
      <section class="card">
        <div class="card-header"><h2>테스트 영역</h2><small>HTML을 고친 뒤 Patch</small></div>
        <div id="test-area"><textarea id="test-input" spellcheck="false" aria-label="테스트 영역 HTML"></textarea></div>
      </section>
    </div>

    <section class="card">
      <div class="card-header"><h2>마지막 diff 결과</h2><small>패치 트리 (JSON)</small></div>
      <pre id="patch-log">아직 Patch하지 않았습니다.</pre>
    </section>
  </main>
  <script type="module" src="./src/phase1/main.js"></script>
</body>
</html>
