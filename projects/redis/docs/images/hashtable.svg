<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="해시 테이블: 키를 FNV-1a로 정수로 바꾸고 칸 수로 나눈 나머지 칸의 목록에 저장한다. 충돌하면 목록 끝에 이어 붙인다">
<title>해시 테이블: FNV-1a + 체이닝</title>
<style>
.bg{fill:#fafaf9}.t1{fill:#111110}.t2{fill:#6b6a66}.card{fill:#ffffff;stroke:#e4e3df}
.blue{fill:#2a78d6}.blueSoft{fill:#eef4fc;stroke:#2a78d6}.orangeSoft{fill:#fdf0ea;stroke:#e8622c}.tO{fill:#c4511f}.tB{fill:#2a78d6}
.cell{fill:#ffffff;stroke:#d9d8d3}.node{fill:#f4f3f0;stroke:#d9d8d3}.link{stroke:#a3a29c}.pillText{fill:#ffffff}
text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#171716}.t1{fill:#f2f1ee}.t2{fill:#a9a8a1}.card{fill:#222221;stroke:#3a3936}
.blue{fill:#4b93ea}.blueSoft{fill:#162436;stroke:#4b93ea}.orangeSoft{fill:#38211a;stroke:#f07a48}.tO{fill:#f39a73}.tB{fill:#6aa7ef}
.cell{fill:#222221;stroke:#3a3936}.node{fill:#2a2a28;stroke:#3a3936}.link{stroke:#6f6e69}}
</style>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".08"/></filter>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#a3a29c"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#2a78d6"/></marker>
</defs>
<rect class="bg" width="760" height="340" rx="14"/>
<text class="t1" x="28" y="38" font-size="18" font-weight="700">해시 테이블: FNV-1a + 체이닝</text>
<text class="t2" x="28" y="60" font-size="13">키 하나가 칸에 들어가는 과정</text>

<!-- 단계 -->
<g font-size="12">
<rect class="card" x="28" y="88" width="120" height="64" rx="12" stroke-width="1" filter="url(#sh)"/>
<circle class="blue" cx="46" cy="106" r="9"/><text class="pillText" x="46" y="110" text-anchor="middle" font-weight="700" font-size="11">1</text>
<text class="t2" x="62" y="110">키</text>
<text class="t1" x="88" y="138" font-size="14" font-weight="700" text-anchor="middle">"user:1"</text>
<path class="link" d="M148,120 L168,120" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>

<rect class="card" x="172" y="88" width="120" height="64" rx="12" stroke-width="1" filter="url(#sh)"/>
<circle class="blue" cx="190" cy="106" r="9"/><text class="pillText" x="190" y="110" text-anchor="middle" font-weight="700" font-size="11">2</text>
<text class="t2" x="206" y="110">FNV-1a 해시</text>
<text class="t1" x="232" y="138" font-size="14" font-weight="700" text-anchor="middle">64비트 정수</text>
<path class="link" d="M292,120 L312,120" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>

<rect class="card" x="316" y="88" width="120" height="64" rx="12" stroke-width="1" filter="url(#sh)"/>
<circle class="blue" cx="334" cy="106" r="9"/><text class="pillText" x="334" y="110" text-anchor="middle" font-weight="700" font-size="11">3</text>
<text class="t2" x="350" y="110">칸 번호</text>
<text class="t1" x="376" y="138" font-size="14" font-weight="700" text-anchor="middle">해시 % 8 = 3</text>
</g>
<path d="M436,120 C462,120 456,182 486,182" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#ab)"/>

<!-- 칸 배열 -->
<g font-size="12" text-anchor="middle">
<rect class="cell" x="490" y="80" width="40" height="28" rx="4" stroke-width="1"/><text class="t2" x="510" y="99">0</text>
<rect class="cell" x="490" y="110" width="40" height="28" rx="4" stroke-width="1"/><text class="t2" x="510" y="129">1</text>
<rect class="cell" x="490" y="140" width="40" height="28" rx="4" stroke-width="1"/><text class="t2" x="510" y="159">2</text>
<rect class="blueSoft" x="490" y="170" width="40" height="28" rx="4" stroke-width="1.6"/><text class="tB" x="510" y="189" font-weight="700">3</text>
<rect class="cell" x="490" y="200" width="40" height="28" rx="4" stroke-width="1"/><text class="t2" x="510" y="219">4</text>
<rect class="cell" x="490" y="230" width="40" height="28" rx="4" stroke-width="1"/><text class="t2" x="510" y="249">5</text>
<rect class="cell" x="490" y="260" width="40" height="28" rx="4" stroke-width="1"/><text class="t2" x="510" y="279">6</text>
<rect class="cell" x="490" y="290" width="40" height="28" rx="4" stroke-width="1"/><text class="t2" x="510" y="309">7</text>
</g>

<!-- 체인 -->
<g font-size="12" text-anchor="middle">
<path class="link" d="M530,94 L552,94" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<rect class="node" x="556" y="83" width="80" height="22" rx="11" stroke-width="1"/><text class="t1" x="596" y="98">age</text>

<path class="link" d="M530,184 L552,184" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<rect class="orangeSoft" x="556" y="173" width="80" height="22" rx="11" stroke-width="1.2"/><text class="t1" x="596" y="188">item:9</text>
<path class="link" d="M636,184 L654,184" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<rect class="blueSoft" x="658" y="173" width="80" height="22" rx="11" stroke-width="1.6"/><text class="tB" x="698" y="188" font-weight="700">user:1</text>

<path class="link" d="M530,244 L552,244" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<rect class="node" x="556" y="233" width="80" height="22" rx="11" stroke-width="1"/><text class="t1" x="596" y="248">name</text>
</g>
<text class="tO" x="556" y="160" font-size="12" font-weight="600">충돌 → 목록 끝에 이어 붙임</text>

<!-- 설명 -->
<rect class="card" x="28" y="184" width="408" height="60" rx="12" stroke-width="1" filter="url(#sh)"/>
<text class="t1" x="46" y="208" font-size="13" font-weight="700">리사이즈</text>
<text class="t2" x="46" y="230" font-size="12">항목 수 ÷ 칸 수 &gt; 0.75 → 칸 2배, 전부 다시 배치 → 평균 O(1)</text>
<rect class="card" x="28" y="256" width="408" height="60" rx="12" stroke-width="1" filter="url(#sh)"/>
<text class="t1" x="46" y="280" font-size="13" font-weight="700">왜 파이썬 hash()가 아니라 FNV-1a?</text>
<text class="t2" x="46" y="302" font-size="12">실행마다 같은 값 → "이 두 키는 충돌한다" 테스트를 항상 재현</text>
</svg>
